services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    env_file: secrets/postgres.env
    volumes:
      - identity-postgres:/var/lib/postgresql/data
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"']
      interval: 10s
      timeout: 5s
      retries: 10
  identity:
    build: .
    restart: unless-stopped
    env_file: secrets/service.env
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      IDENTITY_ISSUER: https://identity.meta-gravity.com
      IDENTITY_SECRETS_FILE: /app/secrets/identity.json
      AUTH_CONFIG_KEY_FILE: /app/secrets/auth-config.key
    ports: ["127.0.0.1:4200:4200"]
    volumes:
      - ./secrets:/app/secrets:ro
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: [CMD, node, -e, 'fetch("http://127.0.0.1:4200/health").then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))']
      interval: 30s
      timeout: 5s
      retries: 3
volumes:
  identity-postgres:
