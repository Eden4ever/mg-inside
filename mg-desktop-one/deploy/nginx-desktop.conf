# 证书签发前先按 README 配置临时 80 站点；保留其它域名现有配置。
server {
    listen 80;
    server_name desktop.meta-gravity.com;
    location ^~ /.well-known/acme-challenge/ { root /var/www/operation-certbot; }
    location / { return 301 https://$host$request_uri; }
}
server {
    listen 443 ssl;
    server_name desktop.meta-gravity.com;
    ssl_certificate /etc/letsencrypt/live/desktop.meta-gravity.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/desktop.meta-gravity.com/privkey.pem;
    client_max_body_size 50m;
    # /apps 下只含已构建的公开前端，不能将 release 根目录或 secrets 设为 root。
    root /opt/mg-desktop/current/static;
    location = /apps/service-manager { return 308 /apps/service-manager/; }
    location /apps/service-manager/ { try_files $uri $uri/ /apps/service-manager/index.html; }
    location = /apps/personal-center { return 308 /apps/personal-center/; }
    location = /apps/app-manager { return 308 /apps/app-manager/; }
    location = /apps/files { return 308 /apps/files/; }
    location = /apps/identity { return 308 /apps/identity/; }
    location /apps/personal-center/ { try_files $uri $uri/ /apps/personal-center/index.html; }
    location /apps/app-manager/ { try_files $uri $uri/ /apps/app-manager/index.html; }
    location /apps/files/ { try_files $uri $uri/ /apps/files/index.html; }
    location /apps/identity/ { try_files $uri $uri/ /apps/identity/index.html; }
    location = /apps/office-one { return 308 /apps/office-one/; }
    location /apps/office-one/ { try_files $uri $uri/ /apps/office-one/index.html; }
    location = /apps/resource-manager { return 308 /apps/resource-manager/; }
    location /apps/resource-manager/ { try_files $uri $uri/ /apps/resource-manager/index.html; }
    location ^~ /integrations/office/ {
        access_log off;
        proxy_pass http://127.0.0.1:14350;
        proxy_set_header Host $host;
        proxy_buffering off;
        proxy_read_timeout 300s;
    }
    location = /office-engine { return 308 /office-engine/; }
    location ^~ /office-engine/ {
        access_log off;
        proxy_pass http://127.0.0.1:14460/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header X-Forwarded-Host $http_host/office-engine;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_buffering off;
    }
    location ~ ^/apps/[^/]+/assets/.*\.mjs$ {
        try_files $uri =404;
        default_type application/javascript;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
    location ~ ^/apps/[^/]+/assets/ {
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
    location / {
        proxy_pass http://127.0.0.1:4300;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_request_buffering off;
        proxy_buffering off;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }
}
