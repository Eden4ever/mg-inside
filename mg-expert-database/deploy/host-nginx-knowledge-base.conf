server {
    listen 80;
    listen [::]:80;
    server_name yshj.meta-gravity.com;
    location /.well-known/acme-challenge/ { root /var/www/letsencrypt; }
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name yshj.meta-gravity.com;
    ssl_certificate /etc/letsencrypt/live/yshj.meta-gravity.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/yshj.meta-gravity.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
    client_max_body_size 25m;

    location = /knowledge-base-inside { return 301 /knowledge-base-inside/; }
    location /knowledge-base-inside/api/ {
        proxy_pass http://127.0.0.1:4100/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Prefix /knowledge-base-inside;
        proxy_buffering off;
        proxy_read_timeout 300s;
    }
    location /knowledge-base-inside/ {
        root /var/www/mg-expert-database;
        try_files $uri $uri/ /knowledge-base-inside/index.html;
    }
}
