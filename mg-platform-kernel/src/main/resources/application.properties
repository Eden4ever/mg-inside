server.address=${HOST:127.0.0.1}
server.port=${PORT:4300}
spring.application.name=mg-desktop-one
spring.lifecycle.timeout-per-shutdown-phase=30s
spring.cloud.gateway.server.webflux.httpclient.connect-timeout=8000
spring.cloud.gateway.server.webflux.httpclient.response-timeout=300s
spring.cloud.gateway.server.webflux.httpclient.follow-redirect=false
spring.web.resources.add-mappings=false
spring.main.banner-mode=off
