<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512" fill="none">
  <defs>
    <linearGradient id="dialFace" x1="98" y1="430" x2="424" y2="248" gradientUnits="userSpaceOnUse">
      <stop stop-color="#0b3ab4"/><stop offset=".36" stop-color="#1566dc"/><stop offset=".72" stop-color="#29a6ea"/><stop offset="1" stop-color="#5fdcf2"/>
    </linearGradient>
    <linearGradient id="dialSide" x1="110" y1="440" x2="410" y2="300" gradientUnits="userSpaceOnUse">
      <stop stop-color="#051c60"/><stop offset=".5" stop-color="#0a3288"/><stop offset="1" stop-color="#0d5f9e"/>
    </linearGradient>
    <linearGradient id="dialBevel" x1="130" y1="296" x2="392" y2="430" gradientUnits="userSpaceOnUse">
      <stop stop-color="#ffffff" stop-opacity=".85"/><stop offset=".5" stop-color="#c8f2ff" stop-opacity=".3"/><stop offset="1" stop-color="#ffffff" stop-opacity=".08"/>
    </linearGradient>
    <linearGradient id="trail" x1="112" y1="220" x2="222" y2="118" gradientUnits="userSpaceOnUse">
      <stop stop-color="#63d9f5" stop-opacity="0"/><stop offset=".55" stop-color="#57cff2" stop-opacity=".75"/><stop offset="1" stop-color="#8ff0ff"/>
    </linearGradient>
    <linearGradient id="hullTop" x1="176" y1="104" x2="344" y2="322" gradientUnits="userSpaceOnUse">
      <stop stop-color="#ffffff"/><stop offset=".42" stop-color="#eaf6ff"/><stop offset=".78" stop-color="#c2ddf5"/><stop offset="1" stop-color="#93bde4"/>
    </linearGradient>
    <linearGradient id="hullSpine" x1="246" y1="80" x2="290" y2="340" gradientUnits="userSpaceOnUse">
      <stop stop-color="#ffffff"/><stop offset=".5" stop-color="#dcedfd"/><stop offset="1" stop-color="#8ab6e2"/>
    </linearGradient>
    <linearGradient id="hullUnder" x1="140" y1="140" x2="368" y2="356" gradientUnits="userSpaceOnUse">
      <stop stop-color="#3f74b4"/><stop offset=".55" stop-color="#28518f"/><stop offset="1" stop-color="#1b3a6e"/>
    </linearGradient>
    <linearGradient id="canopy" x1="236" y1="168" x2="276" y2="236" gradientUnits="userSpaceOnUse">
      <stop stop-color="#5cc0f7"/><stop offset=".5" stop-color="#1a63ce"/><stop offset="1" stop-color="#0a2b7d"/>
    </linearGradient>
    <radialGradient id="contact" cx="0" cy="0" r="1" gradientTransform="translate(256 372) scale(104 30)" gradientUnits="userSpaceOnUse">
      <stop stop-color="#06265f" stop-opacity=".42"/><stop offset="1" stop-color="#06265f" stop-opacity="0"/>
    </radialGradient>
    <filter id="groundShadow" x="-25%" y="-25%" width="150%" height="165%">
      <feDropShadow dx="0" dy="16" stdDeviation="14" flood-color="#082a63" flood-opacity=".28"/>
    </filter>
    <filter id="craftShadow" x="-32%" y="-30%" width="164%" height="172%">
      <feDropShadow dx="-5" dy="16" stdDeviation="12" flood-color="#082a63" flood-opacity=".34"/>
    </filter>
  </defs>

  <g transform="translate(256 256) scale(1.163) translate(-255.5 -284)">
  <!-- 航迹：延续仪表弧的低空航线 -->
  <path d="M115 215A150 150 0 0 1 217 121" stroke="url(#trail)" stroke-width="15" stroke-linecap="round" fill="none"/>

  <!-- 仪表盘：厚度、面、内沿高光 -->
  <g filter="url(#groundShadow)">
    <path d="M101.4 309.8A158 158 0 0 0 410.6 309.8" stroke="url(#dialSide)" stroke-width="46" stroke-linecap="round" fill="none"/>
    <path d="M101.4 298.8A158 158 0 0 0 410.6 298.8" stroke="url(#dialFace)" stroke-width="46" stroke-linecap="round" fill="none"/>
    <path d="M112 286.5A142 142 0 0 0 400 286.5" stroke="url(#dialBevel)" stroke-width="8" stroke-linecap="round" fill="none"/>
  </g>
  <!-- 刻度 -->
  <g stroke="#f0fdff" stroke-opacity=".92" stroke-linecap="round" stroke-width="7">
    <path d="M140.1 373.5 124.5 385.3"/>
    <path d="M187.9 412.6 179.6 429.2"/>
    <path d="M256 426.6V445.1"/>
    <path d="M324.1 412.6 332.4 429.2"/>
    <path d="M371.9 373.5 387.5 385.3"/>
  </g>

  <!-- 机身在盘面上的接触阴影 -->
  <ellipse cx="256" cy="372" rx="104" ry="30" fill="url(#contact)"/>

  <!-- 飞行器 -->
  <g filter="url(#craftShadow)" transform="translate(253 219) scale(1.12) translate(-253 -213)">
    <path d="M253 91c-6 0-10 8-11 19l-11 97-79 47c-6 4-7 9-5 15l2 7 85-22 6 47-23 22c-3 3-3 8-2 13l38-14 38 14c1-5 1-10-2-13l-23-22 6-47 85 22 2-7c2-6 1-11-5-15l-79-47-11-97c-1-11-5-19-11-19Z" transform="translate(7 13)" fill="url(#hullUnder)"/>
    <path d="M253 91c-6 0-10 8-11 19l-11 97-79 47c-6 4-7 9-5 15l2 7 85-22 6 47-23 22c-3 3-3 8-2 13l38-14 38 14c1-5 1-10-2-13l-23-22 6-47 85 22 2-7c2-6 1-11-5-15l-79-47-11-97c-1-11-5-19-11-19Z" fill="url(#hullTop)" stroke="#8fb7de" stroke-opacity=".5" stroke-width="2"/>
    <path d="M253 91c6 0 10 8 11 19l11 97-6 47-6 47-10 21Z" fill="url(#hullSpine)"/>
    <path d="M249 108c1-9 3-15 4-15 2 0 3 6 4 15l10 99-6 47-5 44-4 9-4-9-5-44-6-47Z" fill="#ffffff" fill-opacity=".55"/>
    <path d="M243 171c0-9 21-9 22 0l3 27c-9-5-20-5-29 0Z" fill="url(#canopy)"/>
    <path d="M246 176c0-4 12-4 13 0l1 12c-5-2-10-2-15 0Z" fill="#a5dcff" fill-opacity=".6"/>
    <path d="m156 252 74-42M278 210l72 42" stroke="#ffffff" stroke-opacity=".92" stroke-width="5" stroke-linecap="round"/>
    <path d="m219 318 21-16M266 302l21 16" stroke="#f2faff" stroke-opacity=".85" stroke-width="3.5" stroke-linecap="round"/>
    <path d="M231 208 152 254" stroke="#6f9ccb" stroke-opacity=".5" stroke-width="2.5" stroke-linecap="round"/>
    <path d="M275 208 354 254" stroke="#6f9ccb" stroke-opacity=".5" stroke-width="2.5" stroke-linecap="round"/>
  </g>
  </g>
</svg>
