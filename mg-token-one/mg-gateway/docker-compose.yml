services:
  mysql:
    image: mysql:8.0
    container_name: mg-gateway-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD before starting MySQL}
      MYSQL_DATABASE: mg_gateway
      TZ: Asia/Shanghai
    command: --default-authentication-plugin=mysql_native_password --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    ports:
      - "13306:3306"
    volumes:
      - mg_gateway_mysql:/var/lib/mysql

volumes:
  mg_gateway_mysql:
